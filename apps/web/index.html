<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Capture happens on a phone, at the property (§5.1). `viewport-fit`
         keeps the layout clear of the notch. `maximum-scale` is deliberately
         NOT set: pinch-zoom is a WCAG 1.4.4 requirement, and someone reading a
         change description on a cracked phone screen needs it more than the
         drag targets need stability. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches `--c-brand` in src/index.css: the installed PWA's status bar is
         part of the product surface, not the browser's. -->
    <meta name="theme-color" content="#0e3b3c" />
    <meta
      name="description"
      content="Rental evidence that stays organized from move-in to deposit recovery. Timestamped, hashed photographs, paired before and after."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Handover" />
    <title>Handover</title>
  </head>
  <body class="bg-paper font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
