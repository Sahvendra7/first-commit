<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Capture happens on a phone, at the property (§5.1). `viewport-fit`
         keeps the layout clear of the notch. `maximum-scale` is deliberately
         NOT set: pinch-zoom is a WCAG 1.4.4 requirement, and someone reading a
         change description on a cracked phone screen needs it more than the
         drag targets need stability. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Record the condition of a rented property at move-in and move-out, with timestamped, hashed photographs."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Handover" />
    <title>Handover</title>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
